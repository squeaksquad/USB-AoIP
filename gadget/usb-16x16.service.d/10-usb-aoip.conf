# usb-16x16.service runs the multi-rate gadget under the project's name
# (configfs usb-aoip, product USB-AoIP) instead of the protected 48 kHz one.
# Installed by work/pi-tuning/install-gadget-usb-aoip.sh in place of
# 10-rates.conf; its rollback puts 10-rates.conf back and removes this file.
[Service]
ExecStart=
ExecStart=/usr/local/sbin/setup-usb-aoip start
ExecStop=
ExecStop=/usr/local/sbin/setup-usb-aoip stop
