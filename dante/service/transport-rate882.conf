# /etc/usb16x16/dante/transport.conf: transport settings for usb16x16-dante-owner,
# read by usb16x16-dante-start (the -transport form) beside owner.conf. Installed
# by install-dante-lowlatency.sh, PRIME_DROP and CAPTURE_DRAIN by install-owner-anchor.sh,
# PRIME_DROP=28 by install-owner-ratepoll.sh, the 96000 keys by install-dante-rate96.sh, their
# prime drop by install-dante-rate96-drop.sh, raised to 96 by install-dante-rate96-drop96.sh,
# the 88200 keys by install-dante-rate882.sh;
# the applier never writes this file.
#
# The return queue's target depth, frames. 144 is the owner's default. At 96 its
# floor measured 45 to 48 frames over five anchors, a battery and a loaded hour
# on 2026-10-12/13 (RESULTS.md, "Both Inferno knobs at 1 ms and the return queue
# at 96").
RX_QUEUE=96
#
# SAMPLE_RATE_DESIGN.md step 4 (2026-10-17): a host at another rate becomes a
# request for the arbiter (usb16x16-dante-rate.path), through the owner's
# --rate-request-file. Needs owner c8b484ac or later.
RATE_REQUESTS=1
#
# The same round trip at every host open (work/mac-driver-spike/SPIKE_PLAN.md,
# Phases B and C, 2026-10-30): the outgoing prime drops a constant number of
# frames of the host's first block, and the gadget capture PCM is restarted at
# each host stop so every session starts empty on a period boundary. Needs owner
# abee374a or later. 28 (was 24) passed the battery on owner c84e6a36 at
# daw_timeline 528 on 2026-10-30; 32 sits on the prime floor (block 48 + packet
# 32 + margin 16 = 96) and skipped a frame on 2 of 12 primes.
PRIME_DROP=28
CAPTURE_DRAIN=1
#
# 96 kHz (RATE96_PLAN.md phase 5, 2026-10-31): every depth doubled from the 48 kHz
# figures, so each lasts the same time (arm A). Clean on the 8-channel loop:
# battery 2026-10-29 (680 / daw_timeline 916, soak and bitexact PASS after a Metric
# Halo reboot) and 0 playback faults in about 205 minutes without a capture on
# 2026-10-31. The prime drop and capture drain at 96 (2026-10-31 evening sweep on owner
# c84e6a36, six opens each, capture drain on): D=48 958 x6, D=72 934-935, D=96 910 x6,
# no unanchored prime; without them the opens drew 919-1004. 48 was installed first
# (958 at every open). 96 passed the battery on 2026-11-01 on a candidate of the same
# owner (911 x4, 600 s soak and bitexact PASS, 0 faults, return queue floor 80): 0.5 ms
# lower. A drop over 48 needs the start wrapper that takes 0 to 96 for a 96 kHz key.
RX_QUEUE_96000=192
RX_SLACK_96000=192
BUFFER_96000=2048
TX_LEAD_96000=256
GUARD_96000=512
USB_PERIOD_96000=96
USB_BUFFER_96000=960
PRIME_DROP_96000=96
CAPTURE_DRAIN_96000=1
#
# 88.2 kHz (RATE882_PLAN.md, 2026-11-01): 96's arm A depths, the same frames (about 9 %
# longer in time). Prime-drop sweep with capture drain on owner c84e6a36, six opens each:
# D=48 912-913, D=72 888-889, D=84 876-877 on 3 opens and 932-933 on 3 (the prime anchored
# a block later), D=96 909-920. 72 is the last drop that anchored early on every open.
# The +-1 is 88.2's non-integer packet grid.
RX_QUEUE_88200=192
RX_SLACK_88200=192
BUFFER_88200=2048
TX_LEAD_88200=256
GUARD_88200=512
USB_PERIOD_88200=96
USB_BUFFER_88200=960
PRIME_DROP_88200=72
CAPTURE_DRAIN_88200=1
