# /etc/usb16x16/dante/startcheck.conf: the start check's thresholds, read by
# usb16x16-dante-startcheck.service as its environment. Every line is
# optional; these are the values the script uses without this file, measured
# on the development network (one PoE switch, a Ferrofish as the far device).
# Change one only with a reason and a measurement: docs/INSTALL.md, "What the
# tuning assumes".
#
# The check counts received Ethernet frames of 128 bytes and over on the
# audio port (ethtool -S) and compares their rate with a whole number of
# Dante flows. It assumes Dante audio is the only steady traffic of that size
# on the port, and that the NIC has per-size receive counters.

# Packets a second from a whole multiple that still counts as a whole start.
# Whole starts measured 5 over; lossy ones 800 or 115 short. Measured at 48 kHz.
USB16X16_STARTCHECK_TOLERANCE=60
# Under this many frames a second, no audio flow is up yet.
USB16X16_STARTCHECK_FLOOR=1000
# Seconds after an endpoint start before the first reading.
USB16X16_STARTCHECK_SETTLE=45
# Seconds per reading; two readings must agree.
USB16X16_STARTCHECK_WINDOW=10
# Seconds to wait for audio to arrive at all before leaving the endpoint alone.
USB16X16_STARTCHECK_FLOWS=180
# Restarts allowed in one episode; after the last a lossy start is left running.
USB16X16_STARTCHECK_MAX=4
# Seconds after which the restart count starts again.
USB16X16_STARTCHECK_EPISODE=900
