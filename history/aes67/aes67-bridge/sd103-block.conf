# Profile: servo-aligned-both-240-rx120-sd144-tx192-target48-trace-txoff950-rxtrim-age50-sd103.
# sd132 with SINK_DELAY=103 instead of 132, one variable, conf only, 2026-09-07,
# on module bc694c24: the rest of the free sink-delay range, priced by the
# Ferrofish stamp phase. The driver places a sink packet's first sample at
# stamp plus delay and copies it at the TIC of the 48-sample frame holding
# that position, so the delay moves the deadline only when the stream's
# grid phase plus the delay crosses a multiple of 48: for phase p every
# delay in 144 - p .. 191 - p has 144's deadline and 144 - p is the lowest
# free value. The phase read from the 2026-09-06 eth0 captures (trace1 and
# txfix, 70 minutes apart across a module reload; stage-trace-20260906/
# stamp-phase.py, evidence in stamp-phase-20260906-captures.txt) is 41 on
# every packet of the sink 0 stream (239.69.121.9): wire phase 9 against the
# Pi's own source at 16, the Pi's stamps being the TIC SAC minus one frame,
# a multiple of 48, so the difference is the phase and the 16 is the 2^32
# mod 48 shift of the SAC high word (it moves 16 every 24.855 h on the wire
# and cancels in the difference). Sink 1 (239.69.193.115) was not in those
# captures; its lead has read within 5-25 us of sink 0's on every interval at
# 144 and at 132, which puts its phase within a sample of 41. Hence 103: 29
# samples under 132, 41 under 144, 0.604 ms, with the deadline of 144 and
# 132 exactly (103 + 41 = 144; 102 would cross, the 41-sample holes of 96).
# Gate before the install: a fresh 3 s eth0 capture by the user (root),
# stamp-phase.py reading grid phase 41 on both Ferrofish streams; a phase
# other than 41 on either sink changes the value to 144 minus the smaller
# phase (re-stage, conf only), and a phase under 12 means the Ferrofish
# flow has restarted since 132 was accepted and 132 itself is crossed.
# Expected on a fresh anchor whose PRIMED lines match the 17:19 anchor's:
# level 29 under sd132 (about 718 at 64 frames against 747), RTL at 32 about
# 0.604 ms under (18.875 ms = 718 + 188), pos_aes67 573 -> 544, pi_total
# about 673, usb_time and the USB remainder unchanged, sink_min_time the same
# 0.93-1.06 ms per interval on both sinks and never negative, the bridge's
# PRIMED lines and floors unchanged (TX front age 296, RX trimmed 21, TX
# floor about 75-85 loaded, RX 72: the bridge does not see the sink delay).
# Watch sink_min_time on every read-lead.sh pair (a value near zero or
# negative on either sink means the phase moved: switch-profile back to
# ...-rxtrim-age50 (144) and re-read the phase), the ZERORUN lines, the
# harness discontinuities, rx_qfloor. The one failure mode of any delay
# under 144 is a Ferrofish flow restart re-drawing the phase (uniform on
# 0..47): 132 is crossed by 12 of the 48 draws, 103 by 41 of them; the lead
# export shows it within one read and the rollback is conf only. Bridge,
# TX prime 192, RX prime 120, offset 950, age margin 50, ring target 48 and
# the RX trim untouched. Acceptance as usual: gate, four loaded 800-impulse
# runs, the 600 s soak with a lead pair around each, zero RECOVERs, no
# negative lead, floors reported, RTL at 32 by the user, on one fresh-anchor
# session.
