# Application-scoped ALSA config for the Dante stage 2 probe. Used through
# ALSA_CONFIG_PATH, so the system ALSA configuration is not touched; the plugin
# is found through ALSA_PLUGIN_DIR. Settings and their reasons are in RESULTS.md.
pcm.inferno {
	type inferno
	# Dante device names take letters, digits and hyphens only (no spaces), 31 at most
	NAME "USB-16x16-Inferno"
	# ASCII "USB16x16"; fixed so saved subscriptions survive an address change
	DEVICE_ID "5553423136783136"
	BIND_IP "eth0"
	SAMPLE_RATE "48000"
	RX_CHANNELS "16"
	TX_CHANNELS "16"
	# 24 removes the transmit dither on 24-bit flows (the default 32 alters the LSB)
	TX_SOURCE_BIT_DEPTH "24"
	# the two knobs are crossed in this revision; keep them equal
	RX_LATENCY_NS "10000000"
	TX_LATENCY_NS "10000000"
}
