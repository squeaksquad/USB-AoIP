# EXPERIMENT 2026-10-12, not installed: asound-inferno-owner.conf with both latency
# knobs at 1 ms: the Pi's own receive latency (TX_LATENCY_NS in this revision) and the
# figure it advertises to its receivers (RX_LATENCY_NS). RESULTS.md, "Latency
# settings as wired". Run through usb16x16-dante-candidate CONFIG=.
# ALSA config for usb16x16-dante-owner (OWNER_DESIGN.md). The same device identity
# as asound-inferno.conf, so the saved subscriptions and Controller routes apply.
# Used through ALSA_CONFIG_PATH by run-owner.sh with the plugin built from
# patches/0001 (plugins/xrun-option); nothing system-wide is changed.
</usr/share/alsa/alsa.conf>
pcm.inferno {
	type inferno
	NAME "USB-16x16-Inferno"
	DEVICE_ID "5553423136783136"
	BIND_IP "eth0"
	SAMPLE_RATE "48000"
	RX_CHANNELS "16"
	TX_CHANNELS "16"
	# 24 removes the transmit dither on 24-bit flows
	TX_SOURCE_BIT_DEPTH "24"
	# the two knobs are crossed in this revision; keep them equal. 2 ms is the
	# value the prototype was measured at.
	RX_LATENCY_NS "1000000"
	TX_LATENCY_NS "1000000"
	# patches/0001: a playback underrun is not reported; the owner moves its own
	# pointer. Without this the only way out of an underrun is a six-second prepare.
	XRUN_REPORT "0"
	# The owner does not poll the device: its state is a function of the clock,
	# and with flows up the descriptor fires thousands of times a second.
	DISABLE_POLLFD "1"
}
