# usb-16x16.service runs the multi-rate gadget (44.1/48/88.2/96 kHz) instead of
# the protected 48 kHz one. Installed by work/pi-tuning/install-gadget-rates.sh;
# its rollback removes this file and the protected unit runs as before.
[Service]
ExecStart=
ExecStart=/usr/local/sbin/setup-usb-16x16-rates start
ExecStop=
ExecStop=/usr/local/sbin/setup-usb-16x16-rates stop
