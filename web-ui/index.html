<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="color-scheme" content="dark">
  <title>USB-AoIP</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='8' fill='%237edac4'/%3E%3Cpath d='M9 10v12m7-16v20m7-16v12' stroke='%2310191a' stroke-width='3'/%3E%3C/svg%3E">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header class="topbar">
    <div class="brand"><strong>USB-AoIP</strong><small id="brand-device" hidden></small><span id="format-line">16 in, 16 out</span></div>
    <nav aria-label="Pages"><button type="button" data-tab="status">Status</button><button type="button" data-tab="control" hidden>Control Room</button><button type="button" data-tab="processor">Processor</button><button type="button" data-tab="system">System</button></nav>
    <div class="pill" id="pill" role="status" data-state="offline"><i aria-hidden="true"></i><span id="pill-text">NOT CONNECTED</span></div>
  </header>
  <main>
    <div id="page-notices" class="page-notices" role="status" aria-live="polite" hidden></div>
    <div id="view"></div>
  </main>
  <div id="change-bar" class="change-bar" role="region" aria-label="Pending changes" hidden></div>
  <div id="toast" role="status" aria-live="polite"></div>
  <dialog id="eq-dialog" class="eq-dialog" aria-labelledby="eq-title"></dialog>
  <dialog id="ask" aria-label="Question"></dialog>
  <dialog id="export-dialog" aria-label="Export EQ"></dialog>
  <script type="module" src="app.mjs"></script>
</body>
</html>
