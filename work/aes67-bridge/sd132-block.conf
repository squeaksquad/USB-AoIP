
# Profile: servo-aligned-both-240-rx120-sd144-tx192-target48-trace-txoff950-rxtrim-age50-sd132.
# age50 with SINK_DELAY=132 instead of 144, one variable, conf only, 2026-09-07,
# on module bc694c24 (the arrival-lead export). Sink delay is the RAVENNA
# driver's playout delay: how long a packet is held between its stamped time
# and the TIC that copies it into the ALSA capture buffer. Nothing in the
# audio is processed by it; a packet that arrives after its TIC is a hole
# (the TIC copies the slot whether or not the packet landed: the 41-sample
# holes at 96 on 2026-09-04). The export made it a measured lever: at 144 the
# least lead per sink read 0.93-1.06 ms over 35 loaded minutes (worst packet
# 930 us, both Ferrofish sinks within 25 us of each other), so at 96 the same
# packets read about -70 us (the holes, to the number), at 120 about 430 us
# would be left at the worst packet, at 132 about 680 us. 132 chosen over 120
# for that margin. Expected: level 12 under age50 on a fresh anchor (about
# 754 against 766; 747 against the 14:48 anchor's 759), RTL at 32 about 0.25
# ms under, the impulse split's pos_aes67 585 -> 573, sink_min_time about
# 0.68-0.81 ms per interval and never negative, the bridge's PRIMED and
# floors unchanged (TX front age 296, RX trimmed 21, TX floor about 81
# loaded, RX 72: the bridge does not see the sink delay). Watch sink_min_time
# on every read-lead.sh pair, the ZERORUN lines and the harness
# discontinuities (a late packet is a hole in ravenna-capture), rx_qfloor.
# Bridge, TX prime 192, RX prime 120, offset 950, age margin 50, ring
# target 48 and the RX trim untouched. Acceptance as usual: gate, four
# loaded 800-impulse runs, the 600 s soak with a lead pair around each,
# zero RECOVERs, no negative lead, floors reported, RTL at 32 by the user,
# on one fresh-anchor session; then a day with the lead read at intervals
# before the label moves past experimental.
