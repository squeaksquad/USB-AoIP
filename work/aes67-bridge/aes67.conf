# ---------------------------------------------------------------------------
# Profile: servo. The period-48 point of profile safe with the Phase 5 USB
# pitch servo: bridge f7226238 steers the UAC2 gadget's Capture Pitch and
# Playback Pitch controls to the PTP rate from the shared estimator and runs
# both converters at exactly 1.0, so the audio path is bit transparent and
# the intersample clipping of the resampler path cannot occur. A slow level
# term holds the differential depth where it settled. Experimental until it
# has four loaded 800-impulse runs. USB_PITCH_SERVO is optional in a block;
# absent means 0.
PROFILE_SERVO_DESCRIPTION="period 48 with the USB pitch servo: converters at 1.0, bit transparent"
PROFILE_SERVO_STATUS=experimental
PROFILE_SERVO_COVER="TX floor 164 over the 144-frame skip bar, 1 run"
PROFILE_SERVO_MEASURED="25.8 ms, 1 x 800 impulses, zero spread"
PROFILE_SERVO_PERIOD=48
PROFILE_SERVO_BUFFER=192
PROFILE_SERVO_RAVENNA_PLAYBACK_BUFFER=384
PROFILE_SERVO_RING=768
PROFILE_SERVO_TARGET=128
PROFILE_SERVO_PLAYBACK_PRIME=96
PROFILE_SERVO_TX_PLAYBACK_PRIME=288
PROFILE_SERVO_RX_PLAYBACK_PRIME=144
PROFILE_SERVO_PRIME_TRIM=0
PROFILE_SERVO_SINK_DELAY=576
PROFILE_SERVO_USB_PITCH_SERVO=1

# ---------------------------------------------------------------------------
# Profile: servo-split. Profile servo with the level servo per direction:
# Capture Pitch and Playback Pitch are driven separately so TX and RX each
# hold their own depth (ring plus playback queue). TX_DEPTH / RX_DEPTH are
# absolute setpoints in frames, 0 = capture the depth at engagement. The
# supervisor refuses a TX_DEPTH under TARGET + 144 + PERIOD and an RX_DEPTH
# under TARGET + 2 * PERIOD. Experimental.
PROFILE_SERVO_SPLIT_DESCRIPTION="period 48, split pitch servo: each direction holds its own depth"
PROFILE_SERVO_SPLIT_STATUS=experimental
PROFILE_SERVO_SPLIT_COVER="as servo until measured"
