# /etc/usb16x16/aes67.conf: operating point for usb16x16-aes67.service.
#
# This is the only file an operator edits. KEY=value lines; values are bare
# tokens or double-quoted strings. Blank lines and # comments are ignored.
# A profile switch is a stack restart: about a minute to audio.
#
# Switch with:  sudo usb16x16-aes67-supervisor switch-profile <name>
# List with:    usb16x16-aes67-supervisor profiles

PROFILE=servo-aligned

# Service settings. Comments go on their own lines; a trailing comment after
# a value is a parse error and the supervisor refuses to start.
# One 1 Hz BRIDGE line in N goes to the journal.
JOURNAL_BRIDGE_EVERY=10
# /run/usb16x16/bridge.log rotates once at this size.
BRIDGE_LOG_CAP_MB=64
# More bridge direction restarts than this in 60 s restarts the stack.
RECOVER_LIMIT_PER_MINUTE=5
# A RECOVER storm of this many in one second with USB input frozen means
# the host is gone: the bridge alone stops and waits (measured at the
# unplug: 33-185 in the first second).
HOST_STORM_RECOVERS_PER_SECOND=10
# With no host, try the bridge again this often, in seconds. A Mac waking
# from sleep resumes the device without re-enumerating, so this retry is
# the only wake signal; each retry costs a bridge start and a 3 s storm,
# no module churn.
HOST_RETRY_SECONDS=60

# ---------------------------------------------------------------------------
# Profile: safe. Period 48 on every PCM (USB and RAVENNA both grant it),
# otherwise the 2026-09-02 point; accepted 2026-09-03, bridge 0254348c.
# Four 600 s runs at 800 impulses: 25.563 ms x2, 25.813 ms, 27.313 ms, zero
# restarts, tx_qfloor 164-193 against the 144-frame skip bar, and no pull
# above 48 frames in any run.
PROFILE_SAFE_DESCRIPTION="period 48: 3.6 ms under safe-96, skip covered, TX floor 164-193"
PROFILE_SAFE_STATUS=accepted
PROFILE_SAFE_COVER="TX floor 164-193 over the 144-frame skip bar"
PROFILE_SAFE_MEASURED="25.6 ms (25.6-27.3), 4 x 800 impulses"
PROFILE_SAFE_PERIOD=48
PROFILE_SAFE_BUFFER=192
PROFILE_SAFE_RAVENNA_PLAYBACK_BUFFER=384
PROFILE_SAFE_RING=768
PROFILE_SAFE_TARGET=128
PROFILE_SAFE_PLAYBACK_PRIME=96
PROFILE_SAFE_TX_PLAYBACK_PRIME=288
PROFILE_SAFE_RX_PLAYBACK_PRIME=144
PROFILE_SAFE_PRIME_TRIM=0
PROFILE_SAFE_SINK_DELAY=576

# ---------------------------------------------------------------------------
# Profile: safe-96. The period-96 point accepted 2026-09-02, bridge 0254348c,
# kept for rollback from safe (period 48).
# Four 600 s runs at 800 impulses: 29.146 ms x3, 28.146 ms x1, zero restarts,
# tx_qfloor 158-197 against the RAVENNA device's 144-frame skip.
PROFILE_SAFE_96_DESCRIPTION="period-96 point of 2026-09-02, rollback for safe: skip covered, TX floor 158-197"
PROFILE_SAFE_96_STATUS=accepted
PROFILE_SAFE_96_COVER="TX floor 158-197 over the 144-frame skip"
PROFILE_SAFE_96_MEASURED="29.1 ms (28.1-29.1), 4 x 800 impulses"
PROFILE_SAFE_96_PERIOD=96
PROFILE_SAFE_96_BUFFER=192
PROFILE_SAFE_96_RAVENNA_PLAYBACK_BUFFER=384
PROFILE_SAFE_96_RING=768
PROFILE_SAFE_96_TARGET=128
PROFILE_SAFE_96_PLAYBACK_PRIME=96
PROFILE_SAFE_96_TX_PLAYBACK_PRIME=288
PROFILE_SAFE_96_RX_PLAYBACK_PRIME=144
PROFILE_SAFE_96_PRIME_TRIM=0
PROFILE_SAFE_96_SINK_DELAY=576

# ---------------------------------------------------------------------------
# Profile: servo. The period-48 point of profile safe with the Phase 5 USB
# pitch servo: bridge f7226238 steers the UAC2 gadget's Capture Pitch and
# Playback Pitch controls to the PTP rate from the shared estimator and runs
# both converters at exactly 1.0, so the audio path is bit transparent and
# the intersample clipping of the resampler path cannot occur. A slow level
# term holds the differential depth where it settled. Experimental until it
# has four loaded 800-impulse runs. USB_PITCH_SERVO is optional in a block;
# absent means 0.
PROFILE_SERVO_DESCRIPTION="period 48 with the USB pitch servo: converters at 1.0, bit transparent"
PROFILE_SERVO_STATUS=experimental
PROFILE_SERVO_COVER="TX floor 164 over the 144-frame skip bar, 1 run"
PROFILE_SERVO_MEASURED="25.8 ms, 1 x 800 impulses, zero spread"
PROFILE_SERVO_PERIOD=48
PROFILE_SERVO_BUFFER=192
PROFILE_SERVO_RAVENNA_PLAYBACK_BUFFER=384
PROFILE_SERVO_RING=768
PROFILE_SERVO_TARGET=128
PROFILE_SERVO_PLAYBACK_PRIME=96
PROFILE_SERVO_TX_PLAYBACK_PRIME=288
PROFILE_SERVO_RX_PLAYBACK_PRIME=144
PROFILE_SERVO_PRIME_TRIM=0
PROFILE_SERVO_SINK_DELAY=576
PROFILE_SERVO_USB_PITCH_SERVO=1

# ---------------------------------------------------------------------------
# Profile: servo-split. Profile servo with the level servo per direction:
# Capture Pitch and Playback Pitch are driven separately so TX and RX each
# hold their own depth (ring plus playback queue). TX_DEPTH / RX_DEPTH are
# absolute setpoints in frames, 0 = capture the depth at engagement. The
# supervisor refuses a TX_DEPTH under TARGET + 144 + PERIOD and an RX_DEPTH
# under TARGET + 2 * PERIOD. Experimental.
PROFILE_SERVO_SPLIT_DESCRIPTION="period 48, split pitch servo: each direction holds its own depth"
PROFILE_SERVO_SPLIT_STATUS=experimental
PROFILE_SERVO_SPLIT_COVER="as servo until measured"
PROFILE_SERVO_SPLIT_MEASURED="not yet"
PROFILE_SERVO_SPLIT_PERIOD=48
PROFILE_SERVO_SPLIT_BUFFER=192
PROFILE_SERVO_SPLIT_RAVENNA_PLAYBACK_BUFFER=384
PROFILE_SERVO_SPLIT_RING=768
PROFILE_SERVO_SPLIT_TARGET=128
PROFILE_SERVO_SPLIT_PLAYBACK_PRIME=96
PROFILE_SERVO_SPLIT_TX_PLAYBACK_PRIME=288
PROFILE_SERVO_SPLIT_RX_PLAYBACK_PRIME=144
PROFILE_SERVO_SPLIT_PRIME_TRIM=0
PROFILE_SERVO_SPLIT_SINK_DELAY=576
PROFILE_SERVO_SPLIT_USB_PITCH_SERVO=2
PROFILE_SERVO_SPLIT_TX_DEPTH=0
PROFILE_SERVO_SPLIT_RX_DEPTH=0
# Level gain, ppm per frame of depth error; optional, absent means 0.05.
PROFILE_SERVO_SPLIT_LEVEL_GAIN=0.05

# ---------------------------------------------------------------------------
# Profile: servo-aligned. Profile servo with the aligned start: the bridge
# times eight RAVENNA capture wakeups (one per driver tick), then re-prepares
# that capture ALIGN_OFFSET_US after the last one, so the reader phase the
# driver fixes at prepare is a constant rather than a per-session draw inside
# one tick. That makes the sink delay's wrap point repeatable, which is what
# lets SINK_DELAY sit inside the repeatable window instead of at 576 (0 mod
# 192, an edge: 1352-1598 across six sessions). Two aligned sweeps
# (2026-09-03, 202211Z and 204113Z) put 96/120/144 on the line at 1453/1477/
# 1501 and 1448/1472/1496, five samples apart, while 576 and 168 each flipped
# a lap between the sessions. 96 is the smallest on-line value plus the 48
# margin the rule asks for; 30.2 ms, repeatable, against the servo profile's
# 28.2-33.3 ms draw. ALIGN_START / ALIGN_OFFSET_US are optional in a block;
# absent means off / 600. Accepted 2026-09-03 on four loaded 800-impulse runs:
# 1416, 1421, 1416, 1400 samples (29.2-29.6 ms), every impulse on one
# sample, zero restarts, zero clips, TX floor 159-163, RX floor 107-133.
PROFILE_SERVO_ALIGNED_DESCRIPTION="period 48, pitch servo, aligned RAVENNA capture start, sink delay 96: repeatable playout"
PROFILE_SERVO_ALIGNED_STATUS=accepted
PROFILE_SERVO_ALIGNED_COVER="TX floor 159-163 over the 144-frame skip bar, RX 107-133"
PROFILE_SERVO_ALIGNED_MEASURED="29.5 ms (29.2-29.6), 4 x 800 impulses, zero spread"
PROFILE_SERVO_ALIGNED_PERIOD=48
PROFILE_SERVO_ALIGNED_BUFFER=192
PROFILE_SERVO_ALIGNED_RAVENNA_PLAYBACK_BUFFER=384
PROFILE_SERVO_ALIGNED_RING=768
PROFILE_SERVO_ALIGNED_TARGET=128
PROFILE_SERVO_ALIGNED_PLAYBACK_PRIME=96
PROFILE_SERVO_ALIGNED_TX_PLAYBACK_PRIME=288
PROFILE_SERVO_ALIGNED_RX_PLAYBACK_PRIME=144
PROFILE_SERVO_ALIGNED_PRIME_TRIM=0
PROFILE_SERVO_ALIGNED_SINK_DELAY=96
PROFILE_SERVO_ALIGNED_USB_PITCH_SERVO=1
PROFILE_SERVO_ALIGNED_ALIGN_START=1
PROFILE_SERVO_ALIGNED_ALIGN_OFFSET_US=600

# ---------------------------------------------------------------------------
# Profile: servo-aligned-both. Profile servo-aligned with the aligned TX
# trigger (not named servo-aligned-tx: that name's keys would spell the
# servo-aligned block's TX_* fields, so a profile name must never be another
# profile's name plus tx or rx): in the driver a playback trigger only raises a flag and the next
# 1 ms tick copies the first period from position 0, so the phase between
# the bridge's trigger and the tick grid is a per-session draw of up to 48
# frames on TX, the draw the aligned capture start leaves (seven aligned
# sessions at sink delay 96 spanned 1400-1453, 53 samples, and the session
# after an aligned recovery read 1320). With ALIGN_TX_TRIGGER=1 the RAVENNA
# playback trigger, at start and at every TX recovery, waits for the next
# grid point plus ALIGN_TX_OFFSET_US on the tick the start measured. Same
# depths and cover as servo-aligned. Experimental until measured across
# sessions.
PROFILE_SERVO_ALIGNED_BOTH_DESCRIPTION="period 48, pitch servo, aligned RAVENNA capture start, TX trigger and TX prime, sink delay 96"
PROFILE_SERVO_ALIGNED_BOTH_STATUS=accepted
PROFILE_SERVO_ALIGNED_BOTH_COVER="TX floor 201-207 over the 144-frame skip bar, RX 96-109"
PROFILE_SERVO_ALIGNED_BOTH_MEASURED="27.6 ms (27.5-27.8), 4 x 800 impulses, zero spread"
PROFILE_SERVO_ALIGNED_BOTH_PERIOD=48
PROFILE_SERVO_ALIGNED_BOTH_BUFFER=192
PROFILE_SERVO_ALIGNED_BOTH_RAVENNA_PLAYBACK_BUFFER=384
PROFILE_SERVO_ALIGNED_BOTH_RING=768
PROFILE_SERVO_ALIGNED_BOTH_TARGET=128
PROFILE_SERVO_ALIGNED_BOTH_PLAYBACK_PRIME=96
PROFILE_SERVO_ALIGNED_BOTH_TX_PLAYBACK_PRIME=288
PROFILE_SERVO_ALIGNED_BOTH_RX_PLAYBACK_PRIME=144
PROFILE_SERVO_ALIGNED_BOTH_PRIME_TRIM=0
PROFILE_SERVO_ALIGNED_BOTH_SINK_DELAY=96
PROFILE_SERVO_ALIGNED_BOTH_USB_PITCH_SERVO=1
PROFILE_SERVO_ALIGNED_BOTH_ALIGN_START=1
PROFILE_SERVO_ALIGNED_BOTH_ALIGN_OFFSET_US=600
PROFILE_SERVO_ALIGNED_BOTH_ALIGN_TX_TRIGGER=1
PROFILE_SERVO_ALIGNED_BOTH_ALIGN_TX_OFFSET_US=600
# The aligned TX prime: the trigger's phase alone selects laps (four sessions
# 2026-09-04: 1339/1350/1349 at 600 and 300 us, 1299 at 850 us); the prime
# instant against the tick grid is the draw, and this drops the ring's front
# frames so the front frame's age at the first tick is a constant (496 frames
# in every session). Accepted 2026-09-04 on four loaded 800-impulse runs:
# 1333, 1324, 1321, 1318 samples (27.5-27.8 ms), every impulse on one
# sample, zero restarts, zero clips; seven prime-on sessions span 1318-1339,
# on a 3-sample grid, against 1400-1453 for servo-aligned.
PROFILE_SERVO_ALIGNED_BOTH_ALIGN_TX_PRIME=1

# ---------------------------------------------------------------------------
# Profile: servo-aligned-both-240. servo-aligned-both with the TX prime at
# 240, one variable. The prime exists to cover the RAVENNA device's
# three-packet pull (144 frames); at period 48 no pull above 48 has
# appeared (tx_pullmax 48 in every run). Accepted 2026-09-04 on four loaded
# 800-impulse runs in one session on bridge 40bec748: 1210 (harness at 32
# frames, levels 1210/1218), then 1218 x800 three times at 64 frames
# (25.2-25.4 ms), zero RECOVERs, zero restarts, tx_qfloor 159 in every run
# (unloaded 205), rx_qfloor 96, tx_pullmax 48, front_age_frames 448.
# RTL Utility at 32 read 29.292 ms against 30.542 on servo-aligned-both.
# The harness level does not depend on its buffer size (32 and 64 read
# the same), so these compare directly with servo-aligned-both's 1318-1333.
PROFILE_SERVO_ALIGNED_BOTH_240_DESCRIPTION="servo-aligned-both with TX prime 240: 1 ms under it, TX floor 159"
PROFILE_SERVO_ALIGNED_BOTH_240_STATUS=accepted
PROFILE_SERVO_ALIGNED_BOTH_240_COVER="TX floor 159 over the 144-frame skip bar, RX 96"
PROFILE_SERVO_ALIGNED_BOTH_240_MEASURED="25.4 ms (25.2-25.4), 4 x 800 impulses, zero spread at 64"
PROFILE_SERVO_ALIGNED_BOTH_240_PERIOD=48
PROFILE_SERVO_ALIGNED_BOTH_240_BUFFER=192
PROFILE_SERVO_ALIGNED_BOTH_240_RAVENNA_PLAYBACK_BUFFER=384
PROFILE_SERVO_ALIGNED_BOTH_240_RING=768
PROFILE_SERVO_ALIGNED_BOTH_240_TARGET=128
PROFILE_SERVO_ALIGNED_BOTH_240_PLAYBACK_PRIME=96
PROFILE_SERVO_ALIGNED_BOTH_240_TX_PLAYBACK_PRIME=240
PROFILE_SERVO_ALIGNED_BOTH_240_RX_PLAYBACK_PRIME=144
PROFILE_SERVO_ALIGNED_BOTH_240_PRIME_TRIM=0
PROFILE_SERVO_ALIGNED_BOTH_240_SINK_DELAY=96
PROFILE_SERVO_ALIGNED_BOTH_240_USB_PITCH_SERVO=1
PROFILE_SERVO_ALIGNED_BOTH_240_ALIGN_START=1
PROFILE_SERVO_ALIGNED_BOTH_240_ALIGN_OFFSET_US=600
PROFILE_SERVO_ALIGNED_BOTH_240_ALIGN_TX_TRIGGER=1
PROFILE_SERVO_ALIGNED_BOTH_240_ALIGN_TX_OFFSET_US=600
PROFILE_SERVO_ALIGNED_BOTH_240_ALIGN_TX_PRIME=1

