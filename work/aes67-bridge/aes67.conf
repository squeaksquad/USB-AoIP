# Profile: servo-aligned-both-240-rx120-sd144-tx192-target48-trace-txoff950-rxtrim-age50.
# rxtrim with ALIGN_PRIME_AGE_MARGIN_US=50, one variable, a bridge build
# (main.cpp daaa3eb7): the prime margin's 5 frames, 2026-09-07. The aligned TX
# prime makes the front frame's age at the first tick a constant, prime depth
# 243 plus the longest wait it allows for, and that allowance was the
# placement margin's arithmetic: margin 150 + 2 ticks - offset 950 = 1200 us,
# 58 frames, front age 301. The 100 us between 150 and 50 is the render
# path's own time (83-104 us, measured 2026-09-06): it has to sit inside the
# placement margin, which stays 150 us, but nothing requires the age to carry
# it. With this key the age is priced at 50 + 2000 - 950 = 1100 us, 53
# frames, front age 296; in the sessions whose placed target falls inside
# that 100 us (about one in ten) the drop leaves the ring up to 5 under the
# prime level and the render hands the RAVENNA playback queue 188-192
# instead of 193-241, and the USB capture wake that falls inside the trigger
# sleep in exactly those sessions refills it at the start (the TX PRIMED
# line's under_prime= says how many). The pickup's mechanism, rendering
# before placing the target, changes nothing about which tick starts the
# session (the placed target is the same grid point either way), so the
# lever is the age arithmetic alone; the placement margin and slack_us are
# untouched. Expected: TX PRIMED front_age_frames 296, target=prime, 5 under
# rxtrim: about 765 at 64 frames on a fresh anchor, RTL at 32 about 19.85
# ms; the TX queue 5 shallower everywhere, floor about 82 loaded (87 on
# rxtrim; the TX cover is what this lever spends: 3.7 ms was the worst TX
# refill gap of 2026-09-06 and the prime held about 30 spare over it, about
# 25 after); RX untouched (floor 72, PRIMED trimmed 21). Watch tx_qfloor and
# tx_qlow, the TX PRIMED under_prime (0, or 1-5 in a long-wait session) and
# front_age_frames 296, target=prime and slack_us, tx_pullmax 48, tx_occ /
# rx_occ 51. TX prime 192, RX prime 120, offset 950, the ring target and the
# RX trim untouched. Acceptance as usual: gate, four loaded 800-impulse
# runs, the 600 s soak, zero RECOVERs, floors reported, RTL at 32 by the
# user, on one fresh-anchor session. Measured 2026-09-07 13:30 UTC on a fresh
# anchor: TX PRIMED ring_at_prime 276 align_dropped 12 front_age_frames 296
# under_prime 0, target=prime slack_us 302; 766 x100 then 766 on all 5,600 of
# the set (predicted 765), TX floor 81 (87 on rxtrim), RX 72, RTL at 32
# 19.875 ms = 766 + 188. The first anchor of the day read 748 x100 with a
# stalled first second (both devices pulled 96 in one 1.65 ms gap, RX floor
# masked at 24) and 17 of its 22 in the terms the bridge does not set; it was
# re-drawn rather than accepted.
