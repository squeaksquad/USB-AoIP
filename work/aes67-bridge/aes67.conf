# Profile: servo-aligned-both-240-rx120-sd144-tx192-target48-trace-txoff950-rxtrim.
# target48-trace-txoff950 with RX_PRIME_TRIM=1, one variable, a bridge build
# (main.cpp 77450aaa): the RX prime overshoot lever, 2026-09-06. The RX prime
# is checked at the USB capture's wakes, where the ring grows 96 per wake, so
# it lands at ring 192 whatever the intended level (187 at target 64, 171 at
# 48) and the overshoot is permanent RX depth: on target48 the RX queue
# started 21 over its 120 prime and the RX floor read 93 against 77 on every
# profile since rx120. The aligned TX prime drops its own overshoot from the
# front; the RX prime had no such cut. With this key the ravenna-to-usb
# direction alone discards ring_at_prime - intended from the ring's front at
# prime time (the code PRIME_TRIM runs for both directions, gated to RX);
# usb-to-ravenna is not trimmed, its aligned drop sets its front age, and
# PRIME_TRIM stays 0. A RECOVER re-prime runs the same path. Expected: RX
# PRIMED ring_at_prime 192 trimmed 21, the RX queue starting at 120 exactly,
# about 21 under target48: about 764 at 64 frames on a fresh anchor, RTL at
# 32 about 19.83 ms; TX front age 301 and the TX floor (94 loaded) unchanged;
# RX floor about 72 (93 less 21: the 77 of rx120 had the 5-frame overshoot of
# intended 187 inside it, and that 5 goes too). Watch the RX PRIMED trimmed=
# and ring_at_prime, rx_qfloor and rx_qlow, tx_occ / rx_occ 51, the TX PRIMED
# front_age_frames 301, target=prime and slack_us. TX prime 192, RX prime
# 120, offset 950, the margin and the ring target untouched.
# Acceptance as usual: gate, four loaded 800-impulse runs, the 600 s soak,
# zero RECOVERs, floors reported, RTL at 32 by the user, on one fresh-anchor
