# ---------------------------------------------------------------------------
# Profile: servo. The period-48 point of profile safe with the Phase 5 USB
# pitch servo: bridge f7226238 steers the UAC2 gadget's Capture Pitch and
# Playback Pitch controls to the PTP rate from the shared estimator and runs
# both converters at exactly 1.0, so the audio path is bit transparent and
# the intersample clipping of the resampler path cannot occur. A slow level
# term holds the differential depth where it settled. Experimental until it
# has four loaded 800-impulse runs. USB_PITCH_SERVO is optional in a block;
# absent means 0.
PROFILE_SERVO_DESCRIPTION="period 48 with the USB pitch servo: converters at 1.0, bit transparent"
PROFILE_SERVO_STATUS=experimental
PROFILE_SERVO_COVER="TX floor 164 over the 144-frame skip bar, 1 run"
