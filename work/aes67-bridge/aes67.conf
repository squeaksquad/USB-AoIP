# Profile: servo-aligned-both-240-rx120-sd144-tx192-target64-rxalign. The
# accepted target64 point with the RX trigger and prime aligned to the
# host's USB frame grid, one lever (2026-09-05, Phase 5). Every point on
# the seed binary and target64 itself measured 34-64 samples apart between
# sessions with identical PRIMED numbers (27.396 and 28.104 on target64;
# 1102 and 1154 on seed15/shift30 with the same ring fill and front age):
# the one start phase the bridge did not align is RX's, whose playout is
# drained by the host on its own 1 ms frames while the RAVENNA tick grid is
# redrawn at every stack start. With ALIGN_RX_TRIGGER the USB playback
# start sleeps to the next USB capture fresh wake (locked to the host's
# frames) plus 600 us; with ALIGN_RX_PRIME the RX prime waits for that
# first reference and drops from the ring's front the frames that make the
# front frame's age at the first host frame after the trigger a constant,
# the TX method with the roles swapped. Expected: RX PRIMED carries
# prime_phase_us/first_tick_wait_us/front_age_frames instead of -1, the
# level lands on the same sample across restarts (the acceptance: two
# sessions, each with the four loaded runs and the soak, on one level), at
# or below target64's low shelf (1127, RTL 27.4). Floors as target64
# (108/77) if the drop is small; the drop can be up to 48 so the RX floor
# may read up to 48 lower on a session that draws the long wait; that is
# what the second session shows. No seed, so the level is one variable.
