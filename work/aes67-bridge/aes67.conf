# entry (2026-09-06 00:40 UTC). The TX prime holds the ring until it can
# absorb the longest wait from the prime to the first tick, margin + 2
# ticks - offset, and drops from the front so the front frame's age at the
# first tick is prime plus that longest wait: 77 frames at 600/200, 58 at
# 950/150, so the TX front age at the first tick is 317 instead of 336 and
# the level should read 19 lower, about 799-809 at 64 frames on a fresh
# anchor (818-828 for target64-trace). The ring hold level is unchanged
# (308). History: the first build of this lever (main.cpp caac4e1d, bridge
# 0c7e0b0c, 2026-09-06 19:13 UTC) used margin 50 us and read 793 x100
# (front age 312, Pi path 746, RTL at 32 20.438 ms), but its ALIGN trigger
# slack showed the prime path from placing the target to entering the
# trigger takes about 104 us, so one prime in twenty would miss the target
# and take the next tick (target=prime-missed, negative slack_us, that
# session 48 higher); 150 us covers the render with 46 us spare for 5
# frames. What the lever costs: the TX queue's level is the front age less
# the ring, so the frames taken off the front age come off the TX floor
# 1:1 (83 at 50 us against 104-107 on target64-trace; expect about 88
