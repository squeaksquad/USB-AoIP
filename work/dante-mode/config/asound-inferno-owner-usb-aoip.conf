# 2026-10-30: the Dante device is named after the project. The installed config
# (asound-inferno-owner-rate44-48-arbiter.conf, 19da7c70 at 48 kHz) with NAME
# "USB-AoIP" in place of "USB-16x16-Inferno", the one change. DEVICE_ID and
# STATE_ID stay, so the Pi's own saved subscriptions (RX 1-16 <- Pulse Output
# 17-32) carry over; the Pulse's subscriptions to the Pi name the device and are
# made again after the install (TX n@USB-AoIP -> Input 16+n). The applier still
# rewrites SAMPLE_RATE below. Installed by service/install-dante-name.sh.
#
# SAMPLE_RATE_DESIGN.md step 7 for 44.1 kHz, 2026-10-28: the installed config
# (asound-inferno-owner-rate48-arbiter.conf, 0a1688e1) offering 44100 beside
# 48000, the one change. 44.1 passed its battery on the real loop on 2026-10-27
# and its start slips were fixed by owner rate5 (2578c73d). A set from
# Controller or Dante Switcher to 44100 is now handed to the arbiter, which
# moves the stack only when the Mac is at that rate ("the Mac decides"); a host
# at 44.1 becomes a request through the owner's --rate-request-file. The
# applier rewrites SAMPLE_RATE below; SUPPORTED_SAMPLE_RATES it never writes.
# Installed by service/install-dante-rate44.sh.
#
# SAMPLE_RATE_DESIGN.md step 4, 2026-10-17, staged: the step-2 config plus
# RATE_REQUEST_FILE (patches/0005): a set from Controller or Dante Switcher to
# an offered rate other than the current one is handed to the arbiter
# (usb16x16-dante-rate.path). With 48000 the only rate offered, nothing is ever
# handed on: a set to 48000 is acknowledged and any other is refused, as before.
#
# Step 2, 2026-10-16: the installed config
# (asound-inferno-owner-both1ms.conf) plus patches/0004's keys, for the
# plugin built from patches 0001-0004. The endpoint publishes its rate
# (48 kHz, the only one offered until a rate change exists) to Dante
# Controller and netaudio and refuses a set to anything else. Board-info
# byte 0x17 = 0x18: sample-rate (0x08) and encoding (0x10) configuration,
# nothing else (netaudio's decoding of the capability word). DEVICE_ID is
# eth0's MAC plus process 0000, which netaudio can read as a MAC; STATE_ID
# keeps the saved subscriptions in the old ID's directory, shared with a
# rollback.
# EXPERIMENT 2026-10-12, not installed: asound-inferno-owner.conf with both latency
# knobs at 1 ms: the Pi's own receive latency (TX_LATENCY_NS in this revision) and the
# figure it advertises to its receivers (RX_LATENCY_NS). RESULTS.md, "Latency
# settings as wired". Run through usb16x16-dante-candidate CONFIG=.
# ALSA config for usb16x16-dante-owner (OWNER_DESIGN.md). The same device identity
# as asound-inferno.conf, so the saved subscriptions and Controller routes apply.
# Used through ALSA_CONFIG_PATH by run-owner.sh with the plugin built from
# patches/0001 (plugins/xrun-option); nothing system-wide is changed.
</usr/share/alsa/alsa.conf>
pcm.inferno {
	type inferno
	NAME "USB-AoIP"
	# netaudio takes its MAC from the mDNS id and cannot decode the ASCII one
	# ("USB16x16"), so it sent no settings queries. eth0's MAC plus process 0000,
	# the form the Ferrofish uses; STATE_ID (patches/0004) keeps the saved
	# subscriptions under the old ID's directory.
	DEVICE_ID "88a29e8b01e40000"
	STATE_ID "5553423136783136"
	BIND_IP "eth0"
	SAMPLE_RATE "48000"
	# patches/0004
	SUPPORTED_SAMPLE_RATES "44100,48000"
	BOARD_FLAGS_17 "18"
	# patches/0005
	RATE_REQUEST_FILE "/run/usb16x16-dante/rate-request"
	RX_CHANNELS "16"
	TX_CHANNELS "16"
	# 24 removes the transmit dither on 24-bit flows
	TX_SOURCE_BIT_DEPTH "24"
	# the two knobs are crossed in this revision; keep them equal. 2 ms is the
	# value the prototype was measured at.
	RX_LATENCY_NS "1000000"
	TX_LATENCY_NS "1000000"
	# patches/0001: a playback underrun is not reported; the owner moves its own
	# pointer. Without this the only way out of an underrun is a six-second prepare.
	XRUN_REPORT "0"
	# The owner does not poll the device: its state is a function of the clock,
	# and with flows up the descriptor fires thousands of times a second.
	DISABLE_POLLFD "1"
}
