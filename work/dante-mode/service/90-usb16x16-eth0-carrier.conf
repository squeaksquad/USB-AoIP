# USB 16x16 Dante endpoint: keep eth0's connection (and so its link-local
# address, its routes and the multicast groups joined on it) when the carrier
# drops. Without this NetworkManager deactivates aoip-eth0 about six seconds
# after a carrier loss; Statime then exits on its next send ("Network is
# unreachable") and the endpoint is restarted with it (work/dante-mode/
# RESULTS.md, 2026-10-12). Installed by install-eth0-carrier.sh.
[device-usb16x16-eth0]
match-device=interface-name:eth0
ignore-carrier=true
