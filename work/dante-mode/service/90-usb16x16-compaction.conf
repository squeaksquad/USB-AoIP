# USB 16x16 Dante endpoint: compaction leaves locked pages where they are.
# With the kernel's default of 1, kcompactd moves the owner's mlocked pages
# like any others; a real-time thread that touches a page while it is being
# moved sleeps in a page fault until an ordinary-priority kernel thread has
# finished. That was the owner's stall at idle: 2 to 6.6 ms, a resync and
# tens of milliseconds of silence, four times in 42 hours and three times
# out of three when provoked (work/dante-mode/RESULTS.md, 2026-10-13).
# PREEMPT_RT kernels default this to 0 for the same reason.
# Installed by install-compaction-sysctl.sh.
vm.compact_unevictable_allowed = 0
