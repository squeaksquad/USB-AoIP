# 67 (RX floor 125), 1132-1137 at 382-548, a drop of about 40 between 548
# and 695, then 1098 at 695, 1094 at 765, 1107 at 944, back up at the wrap.
# Plain restarts cluster at 380-550 and draw 1132-1137; target64 was
# accepted on a 1127 draw and read 1161 on another. This window sits on
# the floor of the sawtooth with about 35 us of margin from the drop and
# the climb on either side; the prime waits for it, up to 80 s, discarding
# ring excess with no playback started, on average about 25 s. Expected:
