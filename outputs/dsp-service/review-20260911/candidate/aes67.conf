# mode-1 level loop holds the TX-minus-RX differential where it sat at
# engagement; the shift lowers that setpoint by 60, so the loop walks 30
# frames of servo-held depth from TX to RX at its 3 ppm clamp over about
# 200 s. Servo-held depth is invisible on the device timeline (handoff
# 2026-09-03: the servo moved 48 frames and the round trip did not move one
# sample), so the expected level is seed15's 1102 (23.0 ms, RTL at 32 about
# 26.9 ms) with the floors repartitioned: TX about 130 loaded, RX about 80,
# both over the bars target64 was accepted with (108/77). If RX is wanted at
# 96, shift 45 is the next block (about 115/95). Acceptance as usual, and
# the level must not move from 1102 within the session-start band, which is
# the flag's premise. Needs bridge with --level-shift and supervisor with
# LEVEL_SHIFT_FRAMES.
