# before it steers and pitch sits at nominal for those 60 s while the clocks
# differ by about 15 ppm, so every session moves 46 frames from TX to RX
# during warm-up and the level loop then holds that split; the seed writes
# 1000015 (nominal minus -15, the value every session since 2026-09-03 has
# converged to, pitch 1000014-1000017) to both controls before the prime and
# starts the estimator at -15. Expected: tx_dmean flat through the first
# minute instead of falling 46, TX floor about 150 loaded instead of 108,
# no 4-8 ppm settle overshoot; the level (1127) should not move, since
# servo-held depth is invisible on the device timeline; the 1 ms is cashed
# by the next block's TX prime step. Needs bridge with --pitch-seed and
# supervisor with PITCH_SEED_PPM. Acceptance as usual: gate probe, four
# loaded 800-impulse runs, the 600 s soak, zero RECOVERs, tx_qlow 0.
