# Profile: servo-aligned-both-240-rx120-sd144-tx192-target64-seed15-primes144.
# Phase 5 Stage B3, the rebalance the seed asks for: seed15 with the TX
# playback prime at 144 instead of 192 and the RX playback prime at 144
# instead of 120, two primes moved as one step because they trade against
# each other. seed15 measured TX floor 160 loaded and RX floor 50 (handoff
# "MEASURED ... Stage B2"): the seed keeps the primed split, so the 46 frames
# the warm-up drift used to hand RX stay on TX. TX prime 144 gives back 48
# of TX depth (expected TX floor about 112 loaded, over the bar of one
# period plus the worst wakeup gap, about 96). RX prime 144 lands
# target + prime + 3 = 211 in the next 48-frame bin, so the unaligned RX
# prime fills the ring to 240 instead of 192 and the RX floor at prime is
# 240 - 64 - 51 = 125 (any RX prime from 126 to 173 gives the same), about
# 98 after the loaded dips that took seed15's RX from 77 to 50. Depth: TX
# -48, RX +48, so the level should stay at seed15's 1102 (23.0 ms), RTL at
# 32 about 26.9 ms. Acceptance as usual: gate probe, four loaded 800-impulse
# runs, the 600 s soak, zero RECOVERs, tx_qlow and rx_qlow 0, and floors
# TX over about 96 and RX 96 or better.
