# of 200 (kAlignPrimeMarginNs, bridge built 2026-09-06 from main.cpp
# caac4e1d), one lever from the BUDGET entry (2026-09-06 00:40 UTC). The TX
# prime holds the ring until it can absorb the longest wait from the prime
# to the first tick, margin + 2 ticks - offset, and drops from the front so
# the front frame's age at the first tick is prime plus that longest wait:
# 77 frames at 600/200, 53 at 950/50, so the TX front age at the first tick
# is 312 instead of 336 and the level should read 24 lower, about 794-804
# at 64 frames on a fresh anchor (818-828 for target64-trace). The ring
# hold level is unchanged (308). What the margin risks: the prime renders
# 192 frames between placing its target and sleeping to it; a render longer
# than the margin misses the target and the trigger takes the next grid
# point, one period later (the ALIGN trigger line then reads
# target=prime-missed and a negative slack_us, and that session reads about
# 48 higher). What the offset risks: the playback start lands 50 us before
# the driver's next tick instead of 400, so the TX floor's phase term can
# move; the floor must stay over one period plus the worst wakeup gap (3.7
# ms measured twice on 2026-09-06). Watch tx_qfloor and tx_pullmax across the
# chain, the PRIMED front_age_frames (312), the ALIGN trigger wake_to_start_us
# (about 951) and slack_us. TX prime 192 and RX prime 120 are not touched.
