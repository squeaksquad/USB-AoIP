# Profile: servo-aligned-both-240-rx120-sd144-tx192-target64-trace. The
# accepted target64 point with the impulse trace on (2026-09-06): every
# block entering and leaving the bridge is scanned on channel 1 for a sample
# over 0.15 full scale, and each hit is logged as an IMPULSE line with its
# stage, stream position, block and monotonic time, so one harness impulse
# is stamped at usb-capture, ravenna-playback, ravenna-capture and
# usb-playback. Purpose: split the device-timeline round trip by stage
# (the bridge's two dwells, the AES67 loop between them, and by subtraction
# from the harness level the two Pi USB legs together) and place the second
# session term, the 18-48 samples that move between sessions with identical
# PRIMED numbers, on one side of the bridge. Audio path identical to
# target64; the trace costs one compare per frame and about sixteen log
# lines a second under the harness. Not for service: music on channel 1
# fires it at the hold-off rate (20 lines a second per stage) until the
# 200000-line cap. Analyser: outputs/latency/stage-trace-20260906/
# impulse-stages.py on the full-rate bridge log, with --level for the
# harness's samples at 64 frames.
PROFILE_SERVO_ALIGNED_BOTH_240_RX120_SD144_TX192_TARGET64_TRACE_DESCRIPTION="target64 on the fixed RAVENNA module (transmit slot, work/ravenna-tx-fix), the impulse trace on: the point of record 2026-09-06"
