PROFILE_SERVO_ALIGNED_BOTH_240_RX120_SD144_TX192_TARGET64_TRACE_COVER="TX floor 107 loaded through four 800-impulse runs and the 600 s soak (109 on the first three), RX 77, tx_qlow and rx_qlow 0 on all 1668 lines, tx_pullmax 48, zero RECOVERs in the session; the audio path is target64's, the trace touches nothing"
PROFILE_SERVO_ALIGNED_BOTH_240_RX120_SD144_TX192_TARGET64_TRACE_MEASURED="15.8 ms (757) at 64 frames on module cc6852f0 (supervisor 892dd189): 4 x 800 impulses and a 600 s loaded soak all on 757, zero RECOVERs; RTL Utility at 32 19.688 ms (read at session start). Earlier sessions on the fixed module read 819 and 811 (the session draw); on the original module f65a4955 this block reads about 336 higher (1126-1160)"
