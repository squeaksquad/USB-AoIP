PACKAGE_NAME="usb-aoip-uac2"
PACKAGE_VERSION="1.0"
# Patched sources for the kernel being built for; a refusal here (a patch
# that no longer applies) fails the build with the reason in make.log.
PRE_BUILD="prepare-sources.sh $kernelver"
MAKE[0]="make -C $kernel_source_dir M=$dkms_tree/$PACKAGE_NAME/$PACKAGE_VERSION/build/build modules"
CLEAN="rm -rf build"
BUILT_MODULE_NAME[0]="u_audio"
BUILT_MODULE_LOCATION[0]="build/"
DEST_MODULE_LOCATION[0]="/updates/dkms"
BUILT_MODULE_NAME[1]="usb_f_uac2"
BUILT_MODULE_LOCATION[1]="build/"
DEST_MODULE_LOCATION[1]="/updates/dkms"
AUTOINSTALL="yes"
