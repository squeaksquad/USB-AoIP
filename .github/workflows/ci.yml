name: CI

# Everything here builds and runs off the Pi. Nothing in it touches hardware,
# so a green run says the logic holds, not that an audio-path change is
# acceptable: that still takes measurement (PROJECT_HANDOFF.md).

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  node:
    name: Web UI and DSP compiler (node --test)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node --test web-ui/*.test.mjs
      - run: node --test dsp-compiler/*.test.mjs

  python:
    name: Web control and Dante tools (unittest)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: web-control
        run: python3 -m unittest discover -v -s web-control -p 'test_*.py'
      - name: dante (soak reference; compiles the reference exporter)
        run: python3 -m unittest discover -v -s dante -t dante -p 'test_soak_reference.py'
      - name: tools/diag
        run: python3 -m unittest discover -v -s tools/diag -p 'test_*.py'

  cpp:
    name: Owner headers and DSP core (C++20)
    runs-on: ubuntu-latest
    env:
      CXXFLAGS_STRICT: -std=c++20 -O2 -Wall -Wextra -Wpedantic -Werror
    steps:
      - uses: actions/checkout@v4
      - name: DSP core (cmake, ctest)
        run: |
          cmake -S dsp-core -B build/dsp-core -DCMAKE_BUILD_TYPE=Release
          cmake --build build/dsp-core -j
          ctest --test-dir build/dsp-core --output-on-failure
      - name: Owner header tests
        working-directory: dante/owner
        run: |
          mkdir -p "$RUNNER_TEMP/owner"
          for t in servo chan_holes seq_check rate_check; do
            c++ $CXXFLAGS_STRICT -o "$RUNNER_TEMP/owner/${t}_test" "${t}_test.cpp"
            "$RUNNER_TEMP/owner/${t}_test"
          done
          for t in dsp_path dsp_live meter_tap; do
            c++ $CXXFLAGS_STRICT -I ../../dsp-core/include \
              -o "$RUNNER_TEMP/owner/${t}_test" "${t}_test.cpp" ../../dsp-core/src/bridge_core.cpp
            "$RUNNER_TEMP/owner/${t}_test"
          done

  shell:
    name: Start wrapper and start check (bash)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: bash dante/service/test-dante-start.sh
      - run: bash dante/service/test-dante-start.sh transport
      - run: bash dante/service/test-dante-startcheck.sh

  install-render:
    name: Installer render test (development unit reproduces the point of record)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: bash install/test-render.sh

  # The installer's own build step on arm64, as on the Pi: Statime and the
  # patched Inferno plugin at the pinned revisions, the owner, the DSP runner.
  # It proves the sources, pins, patches and build lines hold. The binaries
  # are not the Pi's (another distribution's compiler and libraries).
  install-build-arm64:
    name: Installer build step (arm64)
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - run: sudo apt-get update -q && sudo apt-get install -y -q build-essential cmake pkg-config libasound2-dev curl git patch
      - run: USB_AOIP_JOBS=4 install/install.sh build --build-dir "$RUNNER_TEMP/usb-aoip-build"
      - name: The same with the draft Statime port-state patch (PTP_STATE=1), to prove it applies and compiles
        run: USB_AOIP_JOBS=4 install/install.sh build --build-dir "$RUNNER_TEMP/usb-aoip-build" --with-port-state
      - run: file "$RUNNER_TEMP"/usb-aoip-build/out/* && "$RUNNER_TEMP/usb-aoip-build/out/usb16x16-dante-owner" --help | head -5 || true

  # The gadget modules for the pinned kernel, built by DKMS exactly as the
  # installer does it, against Raspberry Pi's own headers package.
  kernel-modules-arm64:
    name: Gadget modules by DKMS (Raspberry Pi 6.18.34 headers, arm64)
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 30
    container: debian:trixie
    steps:
      - run: apt-get update -q && apt-get install -y -q ca-certificates curl gnupg git patch perl kmod
      - uses: actions/checkout@v4
      - name: Raspberry Pi package archive
        run: |
          # The archive's current keyring is its own package; the key file on the
          # website is one Debian trixie's verifier no longer accepts.
          deb=$(curl -fsSL http://archive.raspberrypi.com/debian/dists/trixie/main/binary-arm64/Packages.gz | gunzip | awk '/^Package: raspberrypi-archive-keyring$/{p=1} p&&/^Filename:/{print $2; exit}')
          curl -fsSL -o /tmp/keyring.deb "http://archive.raspberrypi.com/debian/$deb"
          dpkg -i /tmp/keyring.deb
          echo "deb [signed-by=/usr/share/keyrings/raspberrypi-archive-keyring.pgp] http://archive.raspberrypi.com/debian/ trixie main" > /etc/apt/sources.list.d/raspi.list
          apt-get update -q
          apt-get install -y -q dkms build-essential "linux-headers-6.18.34+rpt-rpi-2712"
      - run: install/install.sh build-modules "6.18.34+rpt-rpi-2712"
      - name: A kernel the patches do not apply to is refused, with the reason
        run: |
          set +e
          kernel/dkms/prepare-sources.sh 6.18.60+rpt-rpi-2712 /tmp/refused 2> /tmp/refused.log; rc=$?
          cat /tmp/refused.log
          [ "$rc" = 5 ] && grep -q 'REFUSED: uac2-rate-request' /tmp/refused.log
